<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<meta name="theme-color" content="#F7F1E6">
<title>My Reading Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-column phone app. Goal ring + wooden bookshelf home, library grid, stats; bottom tab bar. */
:root{
  --paper:#F7F1E6; --card:#FFFCF6; --ink:#2E2A26; --muted:#7A7066; --line:#E7DCCB;
  --sage:#5E7A5A; --sage-soft:#E3EBDD; --burgundy:#7A2E3A; --wood:#8B6446; --wood-dark:#6B4B33;
  --gold:#C9962B; --slot:#EDE3D3; --shadow:0 1px 2px rgba(46,42,38,.06),0 6px 18px rgba(46,42,38,.07);
  --display:"Lora",Georgia,"Times New Roman",serif; --body:"Nunito Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1E1A17; --card:#29231F; --ink:#F1E8DC; --muted:#B3A698; --line:#3A322C;
  --sage:#9DBB97; --sage-soft:#2F3A2D; --burgundy:#D98A97; --wood:#7A5638; --wood-dark:#5C4029;
  --gold:#E2B552; --slot:#352D27; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1E1A17; --card:#29231F; --ink:#F1E8DC; --muted:#B3A698; --line:#3A322C;
  --sage:#9DBB97; --sage-soft:#2F3A2D; --burgundy:#D98A97; --wood:#7A5638; --wood-dark:#5C4029;
  --gold:#E2B552; --slot:#352D27; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) 24px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;text-wrap:balance}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;width:42px;height:42px;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.goal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:108px;height:108px}
.goal h2{margin:0;font-family:var(--display);font-size:1.6rem;line-height:1.1}
.goal p{margin:.35rem 0 0;color:var(--muted);font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:.8rem;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--sage-soft);color:var(--sage)}
h3.sec{font-family:var(--display);font-size:1.2rem;margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h3.sec span{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:600}
/* bookshelf */
.shelf{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 12px 0;overflow:hidden}
.row{display:flex;align-items:flex-end;gap:4px;min-height:168px;padding:0 4px}
.board{height:12px;background:linear-gradient(var(--wood),var(--wood-dark));border-radius:3px;margin:0 -12px 14px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.spine{flex:0 0 auto;border:0;border-radius:4px 4px 2px 2px;color:#fff;display:flex;align-items:center;justify-content:center;padding:8px 0;position:relative;box-shadow:inset -3px 0 0 rgba(0,0,0,.12),inset 2px 0 0 rgba(255,255,255,.12)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:.72rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine::before,.spine::after{content:"";position:absolute;left:4px;right:4px;height:2px;background:rgba(255,255,255,.35)}
.spine::before{top:10px}.spine::after{bottom:10px}
.spine.empty{background:var(--slot);box-shadow:none;border:1.5px dashed var(--line)}
.spine.empty::before,.spine.empty::after{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* now reading */
.now{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.cover{width:100%;aspect-ratio:2/3;border-radius:6px;object-fit:cover;background:var(--slot);box-shadow:0 2px 8px rgba(0,0,0,.18);display:block}
.fakecover{width:100%;aspect-ratio:2/3;border-radius:6px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:8px;font-family:var(--display);font-weight:600;font-size:.72rem;line-height:1.15;box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:hidden}
.fakecover em{font-family:var(--body);font-style:normal;font-weight:600;font-size:.62rem;opacity:.85}
.title{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2}
.author{color:var(--muted);font-size:.88rem;margin-top:2px}
.bar{height:8px;background:var(--slot);border-radius:999px;overflow:hidden;margin-top:10px}
.bar b{display:block;height:100%;background:var(--sage);border-radius:999px}
/* library */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 0 12px;scrollbar-width:none}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.85rem;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:16px 12px}
.bookbtn{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.bookbtn .t{font-weight:700;font-size:.82rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--gold);letter-spacing:1px;font-size:.85rem}
.pill{align-self:flex-start;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:2px 6px}
.st-Finished{background:var(--sage-soft);color:var(--sage)}
.st-Reading{background:#E2EAF4;color:#2C4A6E}
.st-TBR{background:#F6ECCF;color:#7A5A12}
.st-DNF{background:var(--slot);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-Reading{background:#2A3546;color:#A9C2E2}:root:not([data-theme="light"]) .st-TBR{background:#3B3220;color:#E8CC86}}
:root[data-theme="dark"] .st-Reading{background:#2A3546;color:#A9C2E2}
:root[data-theme="dark"] .st-TBR{background:#3B3220;color:#E8CC86}
.empty-state{text-align:center;color:var(--muted);padding:30px 10px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile small{color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.tile div{font-family:var(--display);font-weight:700;font-size:1.6rem;margin-top:4px;font-variant-numeric:tabular-nums}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:130px;margin-top:6px}
.months div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.7rem;color:var(--muted)}
.months b{width:100%;background:var(--burgundy);border-radius:5px 5px 2px 2px;min-height:3px}
.hbar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:.88rem;margin:8px 0}
.hbar .track{height:12px;background:var(--slot);border-radius:999px;overflow:hidden}
.hbar .track b{display:block;height:100%;border-radius:999px}
.hbar span:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
/* tab bar + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:800;color:var(--muted);padding:6px}
nav.tabs button[aria-current="page"]{color:var(--burgundy)}
nav.tabs svg{width:24px;height:24px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--burgundy);color:#fff;font-weight:800;padding:14px 20px;box-shadow:0 8px 22px rgba(122,46,58,.35);z-index:21;display:flex;align-items:center;gap:8px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet h2{font-family:var(--display);margin:4px 0 12px;font-size:1.35rem}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.results{display:flex;flex-direction:column;gap:8px;margin:-4px 0 12px}
.res{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px}
.res .cover,.res .fakecover{width:44px}
.res .meta{min-width:0}
.res .meta b{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .meta span{color:var(--muted);font-size:.8rem}
.picked{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.ratingpick{display:flex;gap:4px}
.ratingpick button{border:0;background:none;font-size:1.7rem;color:var(--line);padding:0 2px;line-height:1}
.ratingpick button.on{color:var(--gold)}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.segs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;font-size:.85rem}
.segs button[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:800}
.btn.primary{background:var(--burgundy);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--burgundy);flex:0 0 auto}
.note{font-size:.82rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;font-size:.9rem}
/* lock screen */
.lock{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--paper) 72%,transparent);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(46,42,38,.18);padding:24px 20px;width:100%;max-width:400px;text-align:center}
.lockcard h2{font-family:var(--display);font-size:1.5rem;margin:8px 0 6px;text-wrap:balance}
.lockcard p{color:var(--muted);margin:0 0 16px;font-size:.95rem;line-height:1.45}
.lockcard input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px;text-align:center;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.lockmsg{min-height:1.3em;font-size:.88rem;font-weight:700;color:var(--burgundy);margin:2px 0 10px}
.lockcard .btn{width:100%;display:block}
.lockcard a{color:var(--sage);font-weight:800}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small id="yearLabel">2026</small>My Reading Year</div>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="view-shelf">
    <section class="card goal">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--slot)" stroke-width="12"/>
        <circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="var(--sage)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314" stroke-dashoffset="314"/>
        <text id="ringPct" x="60" y="66" text-anchor="middle" font-family="Lora,Georgia,serif" font-weight="700" font-size="22" fill="var(--ink)">0%</text>
      </svg>
      <div>
        <h2 id="goalText">0 of 24 books</h2>
        <p id="goalSub">Let's find your first read.</p>
        <div class="chips" id="goalChips"></div>
      </div>
    </section>
    <h3 class="sec">Currently reading <span id="nowCount"></span></h3>
    <div id="nowList"></div>
    <h3 class="sec">My bookshelf <span>tap a spine</span></h3>
    <div class="shelf" id="shelf"></div>
    <div class="legend" id="legend"></div>
  </main>

  <main id="view-library" hidden>
    <input class="search" id="libSearch" type="search" placeholder="Search your books" aria-label="Search your books">
    <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
    <div class="grid" id="libGrid"></div>
  </main>

  <main id="view-stats" hidden>
    <div class="tiles" id="tiles"></div>
    <h3 class="sec">Books per month</h3>
    <div class="card"><div class="months" id="months"></div></div>
    <h3 class="sec">Top genres</h3>
    <div class="card" id="genres"></div>
    <h3 class="sec">How you read</h3>
    <div class="card" id="formats"></div>
  </main>
</div>

<button class="fab" id="addBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add book</button>

<nav class="tabs" aria-label="Sections">
  <button data-tab="shelf" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20h16M6 20V6h3v14M10 20V4h3v16M15 20l-1-12 3-.5 2 12.5"/></svg>Shelf</button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Library</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>
</nav>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="lock" id="lock" hidden role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <form class="lockcard" id="lockForm" autocomplete="off">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--burgundy)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H19v-5"/><path d="M9 8h6M9 11h4"/></svg>
    <h2 id="lockTitle">Unlock your reading year</h2>
    <p>Enter the license key from your Payhip receipt email. You only need to do this once on each device.</p>
    <input id="lockKey" placeholder="Paste your key" aria-label="License key" autocapitalize="characters" spellcheck="false">
    <div class="lockmsg" id="lockMsg" aria-live="polite"></div>
    <button class="btn primary" id="lockBtn" type="submit">Unlock</button>
    <button class="btn ghost" id="peekBtn" type="button" style="width:100%;margin-top:10px">Look around first</button>
    <p style="margin:14px 0 0" id="buyLine"></p>
  </form>
</div>

<script>
(function(){
"use strict";
var KEY="bookshelf-app-v1";
var GENRES=[["Romance","#B5546A"],["Romantasy","#8E3B5E"],["Fantasy","#4F7A5A"],["Thriller","#8A3B2B"],["Mystery","#3E5A7A"],["Horror","#3A3A3A"],["Sci-Fi","#2F6F86"],["Classics","#6B4F3A"],["Literary","#7A6A4F"],["Historical","#9A6B2F"],["Young Adult","#6A5ACD"],["Nonfiction","#5A6B70"],["Self-help","#B8862A"],["Memoir","#8C6E5A"],["Graphic novel","#C0613C"],["Other","#8C7B6B"]];
var FORMATS=["Print","Ebook","Audiobook"], STATUSES=["Reading","Finished","TBR","DNF"];
var MONTHS=["J","F","M","A","M","J","J","A","S","O","N","D"];
var thisYear=new Date().getFullYear();
var state=load();
var tab="shelf", filter="All";

function sample(){
  var y=thisYear, mk=function(t,a,g,f,p,s,st,en,r){return{id:uid(),title:t,author:a,genre:g,format:f,pages:p,status:s,start:st?y+"-"+st:"",end:en?y+"-"+en:"",rating:r||0,notes:"",cover:"",sample:true}};
  return {year:y,goal:24,seenIntro:false,books:[
    mk("Pride and Prejudice","Jane Austen","Romance","Print",432,"Finished","01-02","01-14",5),
    mk("Frankenstein","Mary Shelley","Horror","Ebook",280,"Finished","01-16","01-24",4),
    mk("The Great Gatsby","F. Scott Fitzgerald","Classics","Audiobook",180,"Finished","02-01","02-05",4),
    mk("Dracula","Bram Stoker","Horror","Print",418,"Finished","02-08","02-25",5),
    mk("Little Women","Louisa May Alcott","Classics","Print",449,"Finished","03-01","03-20",4),
    mk("The Adventures of Sherlock Holmes","Arthur Conan Doyle","Mystery","Ebook",307,"Finished","04-02","04-12",5),

var CHECK_URL="https://bookshelf-key.z6cbt9mnkg.workers.dev";   // Cloudflare Worker address, e.g. https://bookshelf-key.NAME.workers.dev
var BUY_URL="";     // Payhip product page
var LKEY="bookshelf-license-v1", RECHECK_DAYS=7;
var REASONS={not_found:"That key wasn't found. Check it against your Payhip receipt.",disabled:"This key has been turned off (for example after a refund).",too_many:"This key has been used on too many devices. Contact the seller to reset it.",bad_format:"That doesn't look like a license key. Copy it from your receipt.",server_not_set_up:"Unlocking isn't set up yet. Please try again later."};
function getLic(){try{return JSON.parse(localStorage.getItem(LKEY))}catch(e){return null}}
function setLic(v){try{if(v)localStorage.setItem(LKEY,JSON.stringify(v));else localStorage.removeItem(LKEY)}catch(e){}}
function callKey(path,key){return fetch(CHECK_URL.replace(/\/$/,"")+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:key})}).then(function(r){return r.json()})}
function isLocked(){var l=getLic();return !!CHECK_URL&&!(l&&l.key)}
function showLock(msg){
  $("lock").hidden=false;
  $("lockMsg").textContent=msg||"";
  $("buyLine").innerHTML=BUY_URL?'No key yet? <a href="'+esc(BUY_URL)+'" target="_blank" rel="noopener">Get My Reading Year</a>':'';
}
$("peekBtn").onclick=function(){$("lock").hidden=true;toast("Preview mode: tap around the example shelf")};
$("lockForm").addEventListener("submit",function(e){
  e.preventDefault();var key=$("lockKey").value.trim().toUpperCase();
  if(!key){$("lockMsg").textContent="Paste your license key first.";return}
  $("lockBtn").disabled=true;$("lockBtn").textContent="Checking…";$("lockMsg").textContent="";
  callKey("/activate",key).then(function(res){
    if(res&&res.ok){setLic({key:key,checked:Date.now()});$("lock").hidden=true;toast("Unlocked. Happy reading!")}
    else $("lockMsg").textContent=REASONS[res&&res.reason]||"That key didn't work. Check it and try again.";
  }).catch(function(){$("lockMsg").textContent="Couldn't connect. Check your internet and try again."})
  .then(function(){$("lockBtn").disabled=false;$("lockBtn").textContent="Unlock"});
});
function licenseGate(){
  if(!CHECK_URL)return;                 // gate switched off until the checker is live
  var lic=getLic();
  if(!lic||!lic.key){showLock();return}
  if(Date.now()-(lic.checked||0)>RECHECK_DAYS*864e5){
    callKey("/check",lic.key).then(function(res){
      if(res&&res.ok){lic.checked=Date.now();setLic(lic)}
      else if(res&&(res.reason==="disabled"||res.reason==="not_found")){setLic(null);showLock()}
    }).catch(function(){});              // offline: keep working, try again next time
  }
}

render(); fillMissingCovers(); licenseGate();
})();
</script>
</body>
</html>
